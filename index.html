<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>深海の入り江 - WebGPU 釣りゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04121f; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    position: fixed; inset: 0; /* iOSのスクロールバウンス防止 */
    user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  button {
    font-family: inherit; border: none; border-radius: 12px; color: #fff;
    font-weight: bold; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; transition: filter 0.15s, transform 0.1s;
  }
  button:active { filter: brightness(1.3); transform: scale(0.97); }
  button.disabled { opacity: 0.35; pointer-events: none; }

  /* ---- 上部HUD ---- */
  #hud {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; gap: 6px; justify-content: flex-start; pointer-events: none;
  }
  .chip {
    background: rgba(6, 22, 38, 0.72); backdrop-filter: blur(4px);
    border: 1px solid rgba(120, 190, 255, 0.25); border-radius: 8px;
    color: #dcecfa; padding: 4px 10px; font-size: 12px; text-align: center;
  }
  .chip .k { font-size: 10px; color: #7fa8c9; display: block; }
  .chip .v { font-size: 14px; color: #fff; font-variant-numeric: tabular-nums; }

  /* ---- テンションゲージ(ファイト中) ---- */
  #tensionWrap {
    position: absolute; top: calc(58px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); width: min(78vw, 340px); display: none;
  }
  #tensionWrap.show { display: block; }
  #tensionLabel { color: #dcecfa; font-size: 11px; text-align: center; margin-bottom: 3px; text-shadow: 0 1px 3px #000; }
  #tensionBar {
    height: 16px; border-radius: 8px; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.3); overflow: hidden;
  }
  #tensionFill {
    height: 100%; width: 0%; border-radius: 7px;
    background: #3ecf6e; transition: width 0.08s linear, background 0.2s;
  }
  #tensionFill.warn { background: #ffd24a; }
  #tensionFill.danger { background: #ff4a3c; }
  #tensionWrap.danger #tensionBar { animation: shake 0.12s infinite; border-color: #ff6a5c; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); }
  }

  /* ---- 中央メッセージ ---- */
  #msg {
    position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: clamp(22px, 6vw, 34px); font-weight: bold; text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,0.75); pointer-events: none;
    opacity: 0; transition: opacity 0.25s; white-space: pre-line; letter-spacing: 1px;
  }
  #msg.show { opacity: 1; }

  #hint {
    position: absolute; bottom: calc(120px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    color: rgba(220, 236, 250, 0.75); font-size: 12px; pointer-events: none; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7); white-space: pre-line; width: 92vw;
  }

  /* ---- キャストゲージ ---- */
  #powerWrap {
    position: absolute; bottom: calc(140px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); width: min(70vw, 300px); display: none;
  }
  #powerWrap.show { display: block; }
  #powerBar {
    height: 20px; border-radius: 10px; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.35); overflow: hidden;
  }
  #powerFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4aa3e8, #3ecf6e 60%, #ffd24a 85%, #ff8a3c);
  }
  #powerText { text-align: center; color: #fff; font-size: 12px; margin-top: 4px; text-shadow: 0 1px 3px #000; }

  /* ---- 下部操作ボタン ---- */
  #barReady, #barPlay {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    display: none; gap: 10px; justify-content: center; align-items: stretch;
  }
  #barReady.show, #barPlay.show { display: flex; }
  #btnCast {
    flex: 1; max-width: 420px; padding: 20px 0; font-size: 18px;
    background: linear-gradient(180deg, #2b6ab4, #1d4a86);
    box-shadow: 0 4px 14px rgba(0, 60, 130, 0.55);
  }
  #btnReel {
    flex: 2; padding: 20px 0; font-size: 18px;
    background: linear-gradient(180deg, #1d9a56, #14713e);
    box-shadow: 0 4px 14px rgba(0, 90, 40, 0.5);
  }
  #btnReel.on { background: linear-gradient(180deg, #27c06e, #17864a); filter: brightness(1.15); }
  #btnTwitch {
    flex: 1; padding: 20px 0; font-size: 15px;
    background: linear-gradient(180deg, #b08a2a, #7d611c);
  }

  /* ---- アワセ(フッキング)オーバーレイ ---- */
  #strike {
    position: fixed; inset: 0; display: none; z-index: 30;
    background: radial-gradient(circle, rgba(255,80,40,0.12), rgba(255,40,20,0.3));
    align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    touch-action: manipulation;
  }
  #strike.show { display: flex; }
  #strike .big {
    color: #ffe14a; font-size: clamp(44px, 13vw, 84px); font-weight: 900;
    text-shadow: 0 0 24px rgba(255, 120, 0, 0.9), 0 3px 6px #000;
    animation: pulse 0.35s infinite alternate;
  }
  #strike .sub { color: #fff; font-size: 15px; text-shadow: 0 1px 4px #000; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }

  /* ---- リザルト ---- */
  #result {
    position: fixed; inset: 0; display: none; z-index: 40;
    background: rgba(2, 10, 20, 0.6); backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 20px;
  }
  #result.show { display: flex; }
  #resultCard {
    background: linear-gradient(180deg, #0d2c48, #081c30); width: min(92vw, 360px);
    border: 1px solid rgba(120, 190, 255, 0.4); border-radius: 18px;
    padding: 24px 22px calc(20px + env(safe-area-inset-bottom)); text-align: center; color: #dcecfa;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  #resultCard .icon { font-size: 56px; }
  #resultCard h2 { color: #8fd0ff; font-size: 20px; margin: 6px 0 2px; }
  #rSpecies { font-size: 24px; color: #ffd479; font-weight: bold; margin: 8px 0 2px; }
  #rBadge {
    display: none; margin: 6px auto 0; width: fit-content; padding: 3px 12px; border-radius: 20px;
    background: #c9312b; color: #fff; font-size: 12px; font-weight: bold;
  }
  #rBadge.show { display: block; animation: pulse 0.5s infinite alternate; }
  #rStats { display: flex; justify-content: center; gap: 18px; margin: 14px 0 6px; }
  #rStats .k { font-size: 11px; color: #7fa8c9; }
  #rStats .v { font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }
  #rMeta { font-size: 12px; color: #9fc0da; margin-bottom: 16px; }
  #btnNext { width: 100%; padding: 15px 0; font-size: 16px; background: linear-gradient(180deg, #2b6ab4, #1d4a86); }

  /* ---- 設定 ---- */
  #btnGear {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 10px;
    width: 40px; height: 36px; font-size: 17px; background: rgba(6, 22, 38, 0.72);
    border: 1px solid rgba(120, 190, 255, 0.25); border-radius: 8px; z-index: 20;
  }
  #settings {
    position: absolute; top: calc(50px + env(safe-area-inset-top)); right: 10px; width: 250px;
    background: rgba(6, 22, 38, 0.92); backdrop-filter: blur(6px);
    border: 1px solid rgba(120, 190, 255, 0.3); border-radius: 12px;
    color: #dcecfa; padding: 14px 16px; font-size: 13px; display: none; z-index: 20;
  }
  #settings.show { display: block; }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .row label .val { color: #ffd479; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; height: 30px; accent-color: #4aa3e8; touch-action: pan-x; }
  select {
    width: 100%; background: #0b2a44; color: #dcecfa; border: 1px solid #2b5a83;
    border-radius: 5px; padding: 8px 6px; font-size: 14px;
  }
  #btnCam {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 56px;
    width: 40px; height: 36px; font-size: 17px; background: rgba(6, 22, 38, 0.72);
    border: 1px solid rgba(120, 190, 255, 0.25); border-radius: 8px; z-index: 20;
  }
  #btnCam.on { background: rgba(40, 110, 170, 0.85); }
  #perf {
    position: absolute; left: 10px; top: calc(56px + env(safe-area-inset-top)); z-index: 25;
    color: #bfe; font: 12px/1.4 ui-monospace, monospace; white-space: pre;
    background: rgba(0,0,0,0.45); padding: 4px 8px; border-radius: 6px; display: none; pointer-events: none;
  }
  #perf.show { display: block; }
  #err {
    position: fixed; inset: 0; display: none; z-index: 99; background: #04121f; color: #dcecfa;
    align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 15px; line-height: 1.7;
  }
  #err.show { display: flex; }
  body.free #barReady, body.free #barPlay, body.free #hint, body.free #powerWrap { display: none !important; }
</style>
</head>
<body>
<canvas id="app"></canvas>

<div id="hud">
  <div class="chip"><span class="k">距離</span><span class="v" id="hDist">- m</span></div>
  <div class="chip"><span class="k">深度</span><span class="v" id="hDepth">- m</span></div>
  <div class="chip"><span class="k">釣果</span><span class="v" id="hCatch">0 匹</span></div>
</div>

<div id="tensionWrap">
  <div id="tensionLabel">ライン テンション</div>
  <div id="tensionBar"><div id="tensionFill"></div></div>
</div>

<div id="msg"></div>
<div id="hint"></div>

<div id="powerWrap">
  <div id="powerBar"><div id="powerFill"></div></div>
  <div id="powerText">パワー 0%</div>
</div>

<div id="barReady" class="show">
  <button id="btnCast">🎣 長押しでキャスト</button>
</div>
<div id="barPlay">
  <button id="btnReel">🌀 リール(長押し)</button>
  <button id="btnTwitch">⚡ トゥイッチ</button>
</div>

<div id="strike">
  <div class="big">アワセ!!</div>
  <div class="sub">画面をタップ!</div>
</div>

<div id="result">
  <div id="resultCard">
    <div class="icon">🎉</div>
    <h2>キャッチ!</h2>
    <div id="rSpecies">スズキ</div>
    <div id="rBadge">🏆 自己記録更新!</div>
    <div id="rStats">
      <div><div class="k">サイズ</div><div class="v" id="rLen">- cm</div></div>
      <div><div class="k">重さ</div><div class="v" id="rWeight">- kg</div></div>
      <div><div class="k">自己記録</div><div class="v" id="rBest">- cm</div></div>
    </div>
    <div id="rMeta"></div>
    <button id="btnNext">次のキャストへ 🎣</button>
  </div>
</div>

<button id="btnGear" aria-label="設定">⚙</button>
<div id="settings">
  <div class="row">
    <label>リトリーブ速度 <span class="val" id="vSpeed">1.3 m/s</span></label>
    <input type="range" id="speed" min="0.5" max="2.4" step="0.1" value="1.3">
  </div>
  <div class="row">
    <label>潜行レンジ(リップ) <span class="val" id="vRange">1.5 m</span></label>
    <input type="range" id="range" min="0.3" max="3.5" step="0.1" value="1.5">
  </div>
  <div class="row">
    <label>アクション強さ <span class="val" id="vWobble">60%</span></label>
    <input type="range" id="wobble" min="0" max="100" step="5" value="60">
  </div>
  <div class="row">
    <label>ルアータイプ</label>
    <select id="type">
      <option value="floating" selected>フローティング</option>
      <option value="suspend">サスペンド</option>
      <option value="sinking">シンキング</option>
    </select>
  </div>
</div>

<button id="btnCam" aria-label="フリーカメラ">🎥</button>
<div id="perf"></div>
<div id="err"></div>

<script type="module">
// ================================================================ 共通ユーティリティ
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const BENCH = Q.has('bench');
const PERF = Q.has('perf') || BENCH;
const POSE = Q.has('pose') ? +Q.get('pose') : -1;
const FIXT = Q.has('t') ? +Q.get('t') : -1;
const PI2 = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

let seed = 20261117;
const rnd = () => {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const vh = (x, y, z) => { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); };
function vn(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const l = (a, b, t) => a + (b - a) * t;
  return l(l(l(vh(ix, iy, iz), vh(ix + 1, iy, iz), fx), l(vh(ix, iy + 1, iz), vh(ix + 1, iy + 1, iz), fx), fy),
           l(l(vh(ix, iy, iz + 1), vh(ix + 1, iy, iz + 1), fx), l(vh(ix, iy + 1, iz + 1), vh(ix + 1, iy + 1, iz + 1), fx), fy), fz);
}
function vfbm(x, y, z, o) { let s = 0, a = 0.5; for (let i = 0; i < o; i++) { s += a * vn(x, y, z); x = x * 2.03 + 3.1; y = y * 2.03 + 1.7; z = z * 2.03 + 5.3; a *= 0.5; } return s; }

// ================================================================ 地形(JS と描画で共通の高さ関数)
function H(x, z) {
  const zc = z + 3 * Math.sin(x * 0.06);
  let h = -7.2 - 2.8 * sstep(15, 45, x)
    + 0.7 * Math.sin(x * 0.19 + z * 0.13) + 0.5 * Math.sin(z * 0.29 - x * 0.07) + 0.25 * Math.sin(x * 0.61 + z * 0.53);
  h += sstep(4, -7, x) * 10.5;
  const az = Math.abs(zc);
  h += sstep(15, 23, az) * (11 + 3 * Math.sin(x * 0.13) + 2 * Math.sin(z * 0.2));
  h += sstep(85, 118, x) * 17;
  h += sstep(38, 60, az) * 9;
  return h;
}
const Hd = (x, z) => H(x, z) + (vfbm(x * 0.21, 0.3, z * 0.21, 3) - 0.5) * (0.6 + 2.6 * sstep(14, 22, Math.abs(z + 3 * Math.sin(x * 0.06))));
const floorAt = (x, z) => H(x, z) + 0.55;

const SUN = [0.42, 0.62, -0.34];
{ const l = Math.hypot(...SUN); SUN[0] /= l; SUN[1] /= l; SUN[2] /= l; }
const SUNW = [SUN[0] / 1.33, 0, SUN[2] / 1.33];
SUNW[1] = Math.sqrt(1 - SUNW[0] * SUNW[0] - SUNW[2] * SUNW[2]);

// ================================================================ UI
const ui = {
  speed: $('speed'), range: $('range'), wobble: $('wobble'), type: $('type'),
  msg: $('msg'), hint: $('hint'), hDist: $('hDist'), hDepth: $('hDepth'), hCatch: $('hCatch'),
  tensionWrap: $('tensionWrap'), tensionFill: $('tensionFill'),
  powerWrap: $('powerWrap'), powerFill: $('powerFill'), powerText: $('powerText'),
  barReady: $('barReady'), barPlay: $('barPlay'),
  btnCast: $('btnCast'), btnReel: $('btnReel'), btnTwitch: $('btnTwitch'),
  strike: $('strike'), result: $('result'), perf: $('perf'), cam: $('btnCam'),
};
function fail(t) { const e = $('err'); e.textContent = t; e.classList.add('show'); }

if (!navigator.gpu) { fail('このブラウザは WebGPU に対応していません。\n最新の Chrome / Edge / Safari でお試しください。'); throw 0; }
const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
if (!adapter) { fail('WebGPU アダプタを取得できませんでした。'); throw 0; }
const HAS_TS = PERF && adapter.features.has('timestamp-query');
const device = await adapter.requestDevice({ requiredFeatures: HAS_TS ? ['timestamp-query'] : [] });
device.lost.then((i) => fail('GPU デバイスが失われました: ' + i.message));
device.addEventListener('uncapturederror', (e) => console.error('GPU', e.error.message));
const canvas = $('app');
// ?cap: 画面に出さずオフスクリーン描画→読み戻し(ヘッドレス検証用)
const CAP = Q.has('cap'), CAP_DT = +(Q.get('dt') || 1 / 30);
const FMT = CAP ? 'rgba8unorm' : navigator.gpu.getPreferredCanvasFormat();
const ctx = canvas.getContext(CAP ? '2d' : 'webgpu');
if (!CAP) ctx.configure({ device, format: FMT, alphaMode: 'opaque' });

const GU = GPUBufferUsage;
function gbuf(data, usage) {
  const b = device.createBuffer({ size: (data.byteLength + 3) & ~3, usage: usage | GU.COPY_DST });
  device.queue.writeBuffer(b, 0, data);
  return b;
}

// ================================================================ プロシージャルメッシュ
const newMesh = () => ({ p: [], a: [], i: [] });
const O5 = new Float64Array(5);
function surf(m, nu, nv, f, skip) {
  const b = m.p.length / 3;
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    f(i / nu, j / nv, O5); m.p.push(O5[0], O5[1], O5[2]); m.a.push(O5[3], O5[4]);
  }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    if (skip && skip((i + 0.5) / nu, (j + 0.5) / nv)) continue;
    const k = b + j * (nu + 1) + i;
    m.i.push(k, k + 1, k + nu + 1, k + 1, k + nu + 2, k + nu + 1);
  }
}
function build(m, weld = true, nrm = null) {
  const P = m.p, I = m.i, nv = P.length / 3;
  let N = nrm;
  if (!N) {
    N = new Float32Array(nv * 3);
    for (let t = 0; t < I.length; t += 3) {
      const a = I[t] * 3, b = I[t + 1] * 3, c = I[t + 2] * 3;
      const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2];
      const vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      for (const k of [a, b, c]) { N[k] += nx; N[k + 1] += ny; N[k + 2] += nz; }
    }
    if (weld) {
      const map = new Map();
      for (let v = 0; v < nv; v++) {
        const key = Math.round(P[v * 3] * 1e4) + ',' + Math.round(P[v * 3 + 1] * 1e4) + ',' + Math.round(P[v * 3 + 2] * 1e4);
        let g = map.get(key); if (!g) map.set(key, g = []); g.push(v);
      }
      for (const g of map.values()) if (g.length > 1) {
        let x = 0, y = 0, z = 0;
        for (const v of g) { x += N[v * 3]; y += N[v * 3 + 1]; z += N[v * 3 + 2]; }
        for (const v of g) { N[v * 3] = x; N[v * 3 + 1] = y; N[v * 3 + 2] = z; }
      }
    }
  }
  const vb = new Float32Array(nv * 8);
  for (let v = 0; v < nv; v++) {
    let nx = N[v * 3], ny = N[v * 3 + 1], nz = N[v * 3 + 2];
    const l = Math.hypot(nx, ny, nz) || 1;
    vb.set([P[v * 3], P[v * 3 + 1], P[v * 3 + 2], nx / l, ny / l, nz / l, m.a[v * 2], m.a[v * 2 + 1]], v * 8);
  }
  return { vb: gbuf(vb, GU.VERTEX), ib: gbuf(new Uint32Array(I), GU.INDEX), n: I.length };
}

// ---- 地形
function terrainMesh() {
  const X0 = -40, X1 = 160, Z0 = -95, Z1 = 95, S = 0.75;
  const nx = Math.round((X1 - X0) / S), nz = Math.round((Z1 - Z0) / S);
  const m = newMesh();
  const hs = new Float32Array((nx + 3) * (nz + 3));
  for (let j = -1; j <= nz + 1; j++) for (let i = -1; i <= nx + 1; i++) hs[(j + 1) * (nx + 3) + i + 1] = Hd(X0 + i * S, Z0 + j * S);
  const hg = (i, j) => hs[(j + 1) * (nx + 3) + i + 1];
  const N = new Float32Array((nx + 1) * (nz + 1) * 3);
  surf(m, nx, nz, (u, v, o) => {
    const i = Math.round(u * nx), j = Math.round(v * nz);

// ================================================================ GPU リソース
const shaderSrc = `struct U {
  vp: mat4x4f, ivp: mat4x4f,
  cam: vec4f, sun: vec4f, sunW: vec4f, res: vec4f,
  lure: vec4f, tip: vec4f, spl: vec4f, misc: vec4f,
}
@group(0) @binding(0) var<uniform> u: U;

const SIG = vec3f(0.12, 0.052, 0.04);
const HZN = vec3f(0.86, 0.84, 0.82);

fn h12(p: vec2f) -> f32 { var q = fract(vec3f(p.x, p.y, p.x) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
fn h13(p: vec3f) -> f32 { var q = fract(p * 0.1031); q += dot(q, q.zyx + 31.32); return fract((q.x + q.y) * q.z); }
fn n2(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(h12(i), h12(i + vec2f(1, 0)), w.x), mix(h12(i + vec2f(0, 1)), h12(i + vec2f(1, 1)), w.x), w.y);
}
fn n3(x: vec3f) -> f32 {
  let i = floor(x); let f = fract(x); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h13(i), h13(i + vec3f(1, 0, 0)), w.x), mix(h13(i + vec3f(0, 1, 0)), h13(i + vec3f(1, 1, 0)), w.x), w.y),
             mix(mix(h13(i + vec3f(0, 0, 1)), h13(i + vec3f(1, 0, 1)), w.x), mix(h13(i + vec3f(0, 1, 1)), h13(i + vec3f(1, 1, 1)), w.x), w.y), w.z);
}
fn fbm3(p: vec3f) -> f32 { var s = 0.0; var a = 0.5; var q = p; for (var i = 0; i < 4; i++) { s += a * n3(q); q = q * 2.07 + vec3f(3.1, 1.7, 5.3); a *= 0.5; } return s; }
fn fbm2(p: vec2f) -> f32 { var s = 0.0; var a = 0.5; var q = p; for (var i = 0; i < 4; i++) { s += a * n2(q); q = q * 2.03 + vec2f(3.1, 1.7); a *= 0.5; } return s; }
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }

fn sky(d: vec3f) -> vec3f {
  let y = max(d.y, 0.0);
  var c = mix(HZN, vec3f(0.16, 0.42, 0.85), pow(y, 0.5));
  let s = max(dot(d, u.sun.xyz), 0.0);
  c += vec3f(1.0, 0.75, 0.45) * (pow(s, 6.0) * 0.3 + pow(s, 48.0) * 0.6);
  c += vec3f(30.0, 26.0, 20.0) * smoothstep(0.9993, 0.9997, s);
  if (d.y > 0.0) {
    let cp = d.xz / (d.y + 0.12) * 0.9 + vec2f(u.cam.w * 0.004, 0.0);
    let cl = smoothstep(0.5, 0.85, fbm2(cp * 1.5));
    c = mix(c, vec3f(1.0, 0.96, 0.93) * (0.9 + 0.5 * pow(s, 4.0)), cl * smoothstep(0.0, 0.3, d.y) * 0.85);
  }
  return c;
}

fn waterCol(d: vec3f, y: f32) -> vec3f {
  let up = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
  var c = mix(vec3f(0.003, 0.025, 0.09), vec3f(0.01, 0.13, 0.27), smoothstep(0.1, 0.6, up));
  c = mix(c, vec3f(0.07, 0.42, 0.5), smoothstep(0.55, 1.0, up));
  let g = max(dot(d, u.sunW.xyz), 0.0);
  c += vec3f(0.05, 0.22, 0.24) * pow(g, 5.0);
  return c * exp(min(y, 0.0) * 0.045);
}

fn fogW(c: vec3f, p: vec3f) -> vec3f {
  let ro = u.cam.xyz; let v = p - ro; let d = max(length(v), 1e-4); let dir = v / d;
  if (ro.y < 0.0) {
    let T = exp(-SIG * d);
    return c * T + waterCol(dir, ro.y) * (1.0 - T);
  }
  var r = c; var wd = 0.0;
  if (p.y < 0.0) {
    wd = d * (-p.y) / max(ro.y - p.y, 1e-3);
    let T = exp(-SIG * wd);
    r = c * T + waterCol(normalize(vec3f(dir.x, -0.6, dir.z)), 0.0) * (1.0 - T);
  }
  return mix(HZN * 0.95, r, exp(-(d - wd) * 0.0035));
}
fn transm(p: vec3f) -> vec3f {
  let ro = u.cam.xyz; let d = length(p - ro);
  if (ro.y < 0.0) { return exp(-SIG * d); }
  if (p.y < 0.0) { return exp(-SIG * d * (-p.y) / max(ro.y - p.y, 1e-3)) * 0.7; }
  return vec3f(1.0);
}

fn caus1(uv: vec2f, t: f32) -> f32 {
  let p = fract(uv) * 6.2831853 - 250.0;
  var i = p; var c = 1.0;
  for (var n = 0; n < 4; n++) {
    let tt = t * (1.0 - 3.5 / f32(n + 1));
    i = p + vec2f(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2f(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));
  }
  c = 1.17 - pow(c / 4.0, 1.4);
  return pow(abs(c), 8.0);
}
fn caus(p: vec3f) -> f32 {
  let L = u.sunW.xyz;
  let q = p.xz - L.xz * (p.y / L.y);
  let t = u.cam.w * 0.45 + 23.0;
  return caus1(q * 0.16, t) * 0.9 + caus1(q * 0.23 + vec2f(0.37, 0.11), t * 1.1 + 7.0) * 0.6;
}

fn wave(p: vec2f, det: f32) -> vec3f {
  var D = array<vec4f, 7>(
    vec4f(0.8, 0.6, 0.35, 0.07), vec4f(-0.4, 0.92, 0.55, 0.045), vec4f(0.95, -0.3, 0.9, 0.03),
    vec4f(0.2, -0.98, 1.6, 0.014), vec4f(-0.75, -0.66, 2.7, 0.008), vec4f(0.6, 0.8, 4.3, 0.005), vec4f(-0.9, 0.44, 7.1, 0.003));
  var h = 0.0; var g = vec2f(0.0);
  let t = u.cam.w;
  for (var i = 0; i < 7; i++) {
    let w = D[i];
    var a = w.w;
    if (i >= 3) { a *= det; }
    let ph = dot(w.xy, p) * w.z + t * sqrt(9.8 * w.z) + f32(i) * 1.3;
    h += a * sin(ph);
    g += a * w.z * cos(ph) * w.xy;
  }
  return vec3f(h, g);
}

fn sway(h: f32, ph: f32, L: f32) -> vec2f {
  let t = u.cam.w;
  let k = pow(h, 1.4) * L;
  return vec2f(sin(t * 0.55 + ph + h * 2.5) * 0.05 + sin(t * 1.21 + ph * 1.7 + h * 5.0) * 0.015 + 0.03 * h,
               cos(t * 0.47 + ph * 1.3 + h * 2.1) * 0.04 + 0.012 * h) * k;
}

fn shade(p: vec3f, n: vec3f, alb: vec3f, sp: f32, gl: f32, tr: f32, cav: f32) -> vec3f {
  let V = normalize(u.cam.xyz - p);
  if (p.y < 0.0) {
    let L = u.sunW.xyz;
    let dep = -p.y;
    let sT = exp(-SIG * dep * 0.9) * u.sun.w;
    let dc = length(u.cam.xyz - p);
    let ca = caus(p) * exp(-dep * 0.05) * (1.0 - smoothstep(25.0, 65.0, dc));
    let ndl = max(dot(n, L), 0.0);
    let bk = max(-dot(n, L), 0.0) * tr;
    let lit = ndl * (0.3 + 1.7 * ca) + bk * (0.45 + 0.8 * ca);
    let amb = mix(vec3f(0.01, 0.045, 0.085), vec3f(0.06, 0.25, 0.3), n.y * 0.5 + 0.5) * exp(-dep * 0.045);
    var c = alb * (sT * lit + amb * cav * 1.8);
    let hv = normalize(L + V);
    c += sT * sp * pow(max(dot(n, hv), 0.0), gl) * ndl * (0.5 + ca);
    return c;
  }
  let L = u.sun.xyz;
  let ndl = max(dot(n, L), 0.0);
  let amb = mix(vec3f(0.22, 0.2, 0.2), vec3f(0.34, 0.48, 0.72), n.y * 0.5 + 0.5) * 0.5;
  var c = alb * (vec3f(1.0, 0.9, 0.75) * ndl * 1.6 + amb * cav);
  let hv = normalize(L + V);
  c += vec3f(1.0, 0.9, 0.75) * sp * pow(max(dot(n, hv), 0.0), gl) * ndl;
  return c;
}

// ---------------------------------------------------------------- background
struct FO { @builtin(position) pos: vec4f, }
@vertex fn vs_full(@builtin(vertex_index) vi: u32) -> FO {
  var o: FO;
  let x = f32((vi << 1u) & 2u); let y = f32(vi & 2u);
  o.pos = vec4f(x * 2.0 - 1.0, y * 2.0 - 1.0, 0.0, 1.0);
  return o;
}
fn viewDir(fc: vec2f) -> vec3f {
  let nd = vec2f(fc.x * u.res.z * 2.0 - 1.0, 1.0 - fc.y * u.res.w * 2.0);
  let w = u.ivp * vec4f(nd, 1.0, 1.0);
  return normalize(w.xyz / w.w - u.cam.xyz);
}
@fragment fn fs_bg(i: FO) -> @location(0) vec4f {
  let d = viewDir(i.pos.xy);
  if (u.cam.y >= 0.0) { return vec4f(mix(HZN * 0.95, sky(d), smoothstep(-0.02, 0.06, d.y)), 1.0); }
  return vec4f(waterCol(d, u.cam.y), 1.0);
}

// ---------------------------------------------------------------- objects
struct VI {
  @location(0) p: vec3f, @location(1) n: vec3f, @location(2) a: vec2f,
  @location(3) m0: vec4f, @location(4) m1: vec4f, @location(5) m2: vec4f, @location(6) c: vec4f, @location(7) q: vec4f,
}
struct VO {
  @builtin(position) pos: vec4f, @location(0) w: vec3f, @location(1) n: vec3f, @location(2) a: vec2f,
  @location(3) @interpolate(flat) c: vec4f, @location(4) l: vec3f,
}
fn basis(f: vec3f, pos: vec3f, s: f32, roll: f32, o: ptr<function, array<vec4f, 3>>) {
  let X = normalize(f);
  let Z0 = normalize(vec3f(-X.z, 0.0, X.x) + vec3f(1e-5, 0.0, 0.0));
  let Y0 = cross(Z0, X);
  let Y = Y0 * cos(roll) + Z0 * sin(roll);
  let Z = Z0 * cos(roll) - Y0 * sin(roll);
  (*o)[0] = vec4f(X.x * s, Y.x * s, Z.x * s, pos.x);
  (*o)[1] = vec4f(X.y * s, Y.y * s, Z.y * s, pos.y);
  (*o)[2] = vec4f(X.z * s, Y.z * s, Z.z * s, pos.z);
}
@vertex fn vs_obj(v: VI) -> VO {
  let mat = i32(v.c.w + 0.5);
  let t = u.cam.w;
  var lp = v.p;
  var M = array<vec4f, 3>(v.m0, v.m1, v.m2);
  if (mat == 7 || mat == 12 || mat == 8) {
    var ph = v.q.x; var amp = v.q.y;
    if (mat == 8) {
      let ang = t * v.m1.x + v.m1.y;
      let rr = v.m0.w * (0.45 + 0.55 * v.m1.z) + sin(t * 0.7 + v.m1.y * 3.0) * 0.25;
      let c = v.m0.xyz + vec3f(sin(t * 0.05 + v.m0.x) * v.m2.y, sin(t * 0.13 + v.m0.z) * 0.6, cos(t * 0.04 + v.m0.z) * v.m2.y);
      let yy = v.m1.w * sin(ang * 2.0 + v.m1.y * 5.0);
      let sg = sign(v.m1.x);
      let pos = c + vec3f(cos(ang) * rr, yy, sin(ang) * rr);
      let f = vec3f(-sin(ang) * sg, 2.0 * v.m1.w * cos(ang * 2.0 + v.m1.y * 5.0) * sg / max(rr, 0.5), cos(ang) * sg);
      basis(f, pos, v.m2.x, sin(t * 2.0 + v.m1.y) * 0.1, &M);
      ph = v.q.x + t * v.q.z;
    }
    let s = v.a.x;
    lp.z += sin(ph - s * 4.5) * amp * (0.04 + s * s * 1.1);
    lp.x += cos(ph - s * 4.5) * amp * s * s * 0.15 - amp * 0.05;
  }
  if (mat == 9) {
    let ang = t * v.m1.x + v.m1.y;
    let R = v.m0.w;
    let sg = sign(v.m1.x);
    let pos = v.m0.xyz + vec3f(cos(ang) * R, sin(ang * 0.5 + v.m1.y) * v.m1.z, sin(ang) * R * 0.75);
    let f = vec3f(-sin(ang) * sg, cos(ang * 0.5 + v.m1.y) * v.m1.z * 0.5 * v.m1.x / R, cos(ang) * 0.75 * sg);
    basis(f, pos, v.m2.x, -0.22 * sg, &M);
    let az = abs(lp.z);
    lp.y += sin(t * 1.7 + v.m1.y - az * 1.6) * pow(az, 1.5) * 0.32;
  }
  var w = vec3f(dot(M[0], vec4f(lp, 1.0)), dot(M[1], vec4f(lp, 1.0)), dot(M[2], vec4f(lp, 1.0)));
  let c0 = vec3f(M[0].x, M[1].x, M[2].x); let c1 = vec3f(M[0].y, M[1].y, M[2].y); let c2 = vec3f(M[0].z, M[1].z, M[2].z);
  let nn = cross(c1, c2) * v.n.x + cross(c2, c0) * v.n.y + cross(c0, c1) * v.n.z;
  if (mat == 2) { let s = sway(v.a.x, v.q.x, v.q.y); w.x += s.x; w.z += s.y; }
  if (mat == 3 || mat == 6) {
    let k = v.a.x * v.a.x * v.q.y;
    w.x += sin(t * 0.9 + v.q.x + v.a.x) * 0.08 * k; w.z += cos(t * 0.7 + v.q.x * 1.3) * 0.06 * k;
  }
  if (mat == 14) { w.y += sin(t * 0.25 + v.q.x) * 0.35; }
  var o: VO;
  o.pos = u.vp * vec4f(w, 1.0);
  o.w = w; o.n = nn; o.a = v.a; o.c = v.c; o.l = v.p;
  return o;
}

@fragment fn fs_obj(i: VO, @builtin(front_facing) ff: bool) -> @location(0) vec4f {
  var n = normalize(i.n);
  if (!ff) { n = -n; }
  let mat = i32(i.c.w + 0.5);
  let p = i.w;
  let V = normalize(u.cam.xyz - p);
  let dc = length(u.cam.xyz - p);
  var alb = i.c.rgb; var sp = 0.05; var gl = 16.0; var tr = 0.0; var cav = 1.0; var em = vec3f(0.0);
  switch mat {
    case 0, 1, 14: {
      let nz = fbm3(p * 0.33);
      let fine = n3(p * 3.1);
      if (dc < 28.0) {
        let e = 0.07; let b = n3(p * 2.2);
        let g = vec3f(n3(p * 2.2 + vec3f(e, 0, 0)) - b, n3(p * 2.2 + vec3f(0, e, 0)) - b, n3(p * 2.2 + vec3f(0, 0, e)) - b) / e;
        n = normalize(n - (g - n * dot(g, n)) * 0.22 * (1.0 - dc / 28.0));
      }
      let slope = 1.0 - n.y;
      var rock = mix(vec3f(0.3, 0.26, 0.31), vec3f(0.46, 0.38, 0.36), nz) * (0.72 + 0.45 * fine);
      rock *= 0.85 + 0.15 * sin(p.y * 3.3 + nz * 6.0);
      if (mat == 0) {
        var sand = vec3f(0.8, 0.71, 0.56) * (0.82 + 0.3 * fine);
        sand *= 0.9 + 0.1 * sin(p.x * 2.6 + p.z * 1.2 + nz * 7.0);
        alb = mix(sand, rock, smoothstep(0.22, 0.45, slope + (nz - 0.5) * 0.5));
        let gc = smoothstep(0.56, 0.66, fbm3(vec3f(p.x, 0.0, p.z) * 0.11 + vec3f(7.0, 3.0, 1.0))) * (1.0 - smoothstep(0.15, 0.35, slope));
        alb = mix(alb, vec3f(0.6, 0.06, 0.36) * (0.6 + 0.8 * fine), gc);
        em += vec3f(0.5, 0.05, 0.3) * gc * pow(fine, 6.0) * 0.08;
      } else {
        alb = rock * mix(vec3f(1.0), i.c.rgb * 1.6, 0.5);
      }
      let moss = smoothstep(0.6, 0.85, n.y) * smoothstep(0.35, 0.65, nz);
      alb = mix(alb, vec3f(0.08, 0.36, 0.3) * (0.7 + 0.5 * fine), moss * 0.75);
      if (p.y > -0.4) {
        let wet = 1.0 - smoothstep(-0.2, 0.8, p.y);
        alb = mix(rock * 0.9, vec3f(0.2, 0.32, 0.12) * (0.7 + 0.5 * fine), smoothstep(0.75, 0.9, n.y) * smoothstep(0.8, 2.0, p.y)) * (1.0 - 0.45 * wet);
      }
      cav = 0.45 + 0.75 * smoothstep(0.25, 0.7, nz);
      sp = 0.08; gl = 20.0;
    }
    case 2: {
      let leaf = i.a.y;
      alb = i.c.rgb * (0.45 + 0.55 * i.a.x) * (0.8 + 0.35 * n3(p * 4.0));
      alb = mix(alb, alb * vec3f(1.3, 1.1, 0.55), leaf * 0.5);
      tr = 0.55; sp = 0.25; gl = 30.0; cav = 0.35 + 0.65 * i.a.x;
    }
    case 3: {
      let fr = 1.0 - abs(dot(n, V));
      let iri = 0.5 + 0.5 * cos(6.2831 * (vec3f(0.0, 0.33, 0.67) + fr * 1.1 + i.a.x * 0.6 + i.c.r));
      alb = mix(i.c.rgb, iri * vec3f(0.9, 0.5, 1.0), 0.55) * (0.5 + 0.6 * i.a.x);
      em = iri * vec3f(0.5, 0.2, 0.7) * fr * 0.07 * i.a.x;
      tr = 0.7; sp = 0.6; gl = 40.0; cav = 0.4 + 0.6 * i.a.x;
    }
    case 4: {
      let pore = n3(p * 14.0);
      alb = i.c.rgb * (0.65 + 0.45 * pore) * select(1.0, 0.35, i.a.y > 0.5);
      cav = select(0.4 + 0.6 * i.a.x, 0.25, i.a.y > 0.5); sp = 0.05;
    }
    case 5: {
      alb = mix(i.c.rgb * 0.7, vec3f(1.0, 0.85, 0.8), pow(i.a.x, 3.0) * 0.5);
      em = i.c.rgb * pow(i.a.x, 5.0) * 0.12;
      cav = 0.4 + 0.6 * i.a.x; sp = 0.2; gl = 24.0; tr = 0.3;
    }
    case 6: {
      alb = i.c.rgb * (0.4 + 0.8 * i.a.x);
      em = i.c.rgb * pow(i.a.x, 6.0) * 0.18;
      tr = 0.6; cav = 0.3 + 0.7 * i.a.x;
    }
    case 7, 8, 12: {
      let y = i.a.y;
      var back = i.c.rgb;
